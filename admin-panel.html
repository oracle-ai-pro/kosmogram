<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LMSH | Admin Panel</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Roboto', sans-serif; display: flex; justify-content: center; padding: 40px; }
        .panel-card { background: #1e293b; width: 100%; max-width: 600px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        textarea { width: 100%; height: 120px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; padding: 12px; box-sizing: border-box; resize: none; }
        
        #attachments-container { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .file-chip { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 10px 15px; border-radius: 20px; font-size: 14px; }
        .delete-btn { cursor: pointer; color: #f87171; border: none; background: none; font-size: 16px; }
        
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        #status-bar { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; text-align: center; background: #065f46; color: #34d399; }
    </style>
</head>
<body>

<div class="panel-card">
    <h2>Штаб LMSH: Новая запись</h2>
    <textarea id="post-text" placeholder="Что нового, Агент Саня?"></textarea>
    
    <div id="attachments-container"></div>
    
    <input type="file" id="file-input" multiple style="display: none;">
    <button onclick="document.getElementById('file-input').click()">+ Прикрепить файлы</button>
    
    <button id="publish-btn" style="background: #fbbf24;">Опубликовать пост</button>
    
    <div id="status-bar"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
