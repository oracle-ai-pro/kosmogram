<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LMSH | Secure Login</title>
    <style>
        /* Стили Material UI: темная тема, скругления, размытие */
        body { background: #121212; color: #fff; font-family: 'Roboto', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e1e1e; padding: 2rem; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter: blur(10px); text-align: center; }
        input { background: #2c2c2c; border: none; padding: 12px; border-radius: 8px; color: white; width: 250px; font-size: 18px; margin-top: 20px; }
        #timer { font-size: 24px; color: #ff5252; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Агент Саня, подтвердите вход</h2>
    <div id="timer">05</div>
    <input type="text" id="pin-input" placeholder="Введите PIN-код" maxlength="10">
</div>

<script src="auth.js"></script>
</body>
</html>
