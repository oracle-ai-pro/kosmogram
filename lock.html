<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LMSH | System Locked</title>
    <style>
        body { 
            background: #0f172a; color: #e2e8f0; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            height: 100vh; font-family: 'Segoe UI', sans-serif;
            margin: 0; text-align: center;
        }
        .card { 
            background: #1e293b; padding: 3rem; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        #countdown { font-size: 3rem; font-weight: bold; color: #38bdf8; margin: 20px 0; }
        .status { opacity: 0.7; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="card">
    <h1>Штаб LMSH закрыт</h1>
    <div class="status">Финальная калибровка протоколов...</div>
    <div id="countdown">--:--:--:--</div>
    <p>Релиз 2.0 назначен на 28.05.2026</p>
</div>

<script>
    const releaseDate = new Date("2026-05-28T00:00:00").getTime();

    const timer = setInterval(() => {
        const now = new Date().getTime();
        const diff = releaseDate - now;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerText = 
            `${days}д ${hours}ч ${mins}м ${secs}с`;

        if (diff < 0) {
            clearInterval(timer);
            window.location.href = "index.html"; // Авто-переход при наступлении даты
        }
    }, 1000);
</script>
</body>
</html>
